name: Android APK

# Builds a debug-signed APK on GitHub's runners so you never need a local
# JDK/Android SDK/NDK. Trigger it from the Actions tab, or push a v* tag.
#
# The app source lives in ./ai-code-studio, so every step runs from there.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-code-studio

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-code-studio/src-tauri

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "Using cmdline-tools at: $CMDLINE_BIN"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --debug --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-studio-android-debug
          path: ai-code-studio/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
